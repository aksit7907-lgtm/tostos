name: Build Desktop (Windows, macOS)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            pattern: "desktop/release/*.exe"
          - os: macos-latest
            name: macos
            pattern: "desktop/release/*.dmg"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Добавьте секреты SUPABASE_URL и SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Установка зависимостей сайта
        run: bun install

      - name: Сборка сайта (SPA)
        run: npm run build:mobile

      - name: Копирование сайта в desktop/web
        run: node scripts/prepare-desktop.mjs

      - name: Установка Electron
        working-directory: desktop
        run: |
          npm install
          npm version "1.${{ github.run_number }}.0" --no-git-tag-version --allow-same-version

      - name: Сборка установщика
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: tosto-desktop-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
